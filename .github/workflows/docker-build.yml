on:
  push:
    branches:
      - master
    paths-ignore:
      - "**.md"
      - "docs/**"
    tags:
      - "**"
name: docker-build
permissions:
  contents: read
  packages: write
jobs:
  native-build:
    name: Build Linux ${{ matrix.target }} binary
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-386
            goarch: 386
            goarm: ""
          - target: linux-amd64
            goarch: amd64
            goarm: ""
          - target: linux-armv6
            goarch: arm
            goarm: "6"
          - target: linux-armv7
            goarch: arm
            goarm: "7"
          - target: linux-arm64
            goarch: arm64
            goarm: ""
    steps:
      - name: Checkout the code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: ^1.26

      - name: Build binary
        env:
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
          TARGET: ${{ matrix.target }}
        run: |
          version=$(git describe --tags --always)
          mkdir -p "dist/${TARGET}"
          CGO_ENABLED=0 GOOS=linux go build -tags full -trimpath \
            -ldflags "-s -w -buildid= -X github.com/kis1yi/trojan-go/constant.Version=${version} -X github.com/kis1yi/trojan-go/constant.Commit=${GITHUB_SHA}" \
            -o "dist/${TARGET}/trojan-go"

      - name: Upload binary
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: dist/${{ matrix.target }}/trojan-go
          if-no-files-found: error
          retention-days: 1

  runtime-data:
    name: Download runtime data
    runs-on: ubuntu-latest
    steps:
      - name: Download geodata
        run: |
          mkdir -p dist/runtime-data
          curl --fail --location https://github.com/v2fly/domain-list-community/raw/release/dlc.dat --output dist/runtime-data/geosite.dat
          curl --fail --location https://github.com/v2fly/geoip/raw/release/geoip.dat --output dist/runtime-data/geoip.dat
          curl --fail --location https://github.com/v2fly/geoip/raw/release/geoip-only-cn-private.dat --output dist/runtime-data/geoip-only-cn-private.dat

      - name: Upload runtime data
        uses: actions/upload-artifact@v7
        with:
          name: runtime-data
          path: dist/runtime-data
          if-no-files-found: error
          retention-days: 1

  build:
    needs: [native-build, runtime-data]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist

      - name: Setup QEMU
        uses: docker/setup-qemu-action@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare
        id: prepare
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          tags=(
            "${image}:latest"
            "${image}:$(date -u +%Y%m%d)"
          )

          while IFS= read -r tag; do
            if [[ $(git rev-list -n1 "$tag") == "$GITHUB_SHA" ]]; then
              tags+=("${image}:${tag}")
            fi
          done < <(git tag --sort=refname)

          echo "docker_platforms=linux/386,linux/amd64,linux/arm/v6,linux/arm/v7,linux/arm64" >> $GITHUB_OUTPUT
          echo "docker_image=${image}" >> $GITHUB_OUTPUT
          echo "docker_tags=${tags[*]}" >> $GITHUB_OUTPUT
          echo "ref=${GITHUB_SHA}" >> $GITHUB_OUTPUT

      - name: Build and push docker image
        env:
          DOCKER_TAGS: ${{ steps.prepare.outputs.docker_tags }}
        run: |
          read -r -a docker_tags <<< "$DOCKER_TAGS"
          tag_args=()
          for tag in "${docker_tags[@]}"; do
            tag_args+=(--tag "$tag")
          done

          docker buildx build --platform ${{ steps.prepare.outputs.docker_platforms }} \
          --output "type=image,push=true" \
          "${tag_args[@]}" \
          --build-arg REF=${{ steps.prepare.outputs.ref }} \
          --file Dockerfile.github-actions .

  test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Test docker image
        run: |
          docker run --rm --entrypoint /usr/local/bin/trojan-go ghcr.io/${GITHUB_REPOSITORY,,} -version

  cleanup:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Remove old rolling image versions
        uses: actions/github-script@v8
        with:
          script: |
            const owner = context.repo.owner;
            const packageName = context.repo.repo.toLowerCase();
            const { data: account } = await github.request('GET /users/{username}', {
              username: owner,
            });
            const isOrganization = account.type === 'Organization';
            const listRoute = isOrganization
              ? 'GET /orgs/{org}/packages/{package_type}/{package_name}/versions'
              : 'GET /users/{username}/packages/{package_type}/{package_name}/versions';
            const deleteRoute = isOrganization
              ? 'DELETE /orgs/{org}/packages/{package_type}/{package_name}/versions/{package_version_id}'
              : 'DELETE /users/{username}/packages/{package_type}/{package_name}/versions/{package_version_id}';
            const scope = isOrganization ? { org: owner } : { username: owner };
            const versions = await github.paginate(listRoute, {
              ...scope,
              package_type: 'container',
              package_name: packageName,
              per_page: 100,
            });
            const releaseTag = /^v\d+\.\d+\.\d+(?:[-+][0-9A-Za-z.-]+)?$/;
            const rollingTag = /^(?:\d{8}|[0-9a-f]{7})$/;
            const rollingVersions = versions
              .filter((version) => {
                const tags = version.metadata?.container?.tags ?? [];
                return !tags.some((tag) => releaseTag.test(tag)) &&
                  tags.some((tag) => rollingTag.test(tag));
              })
              .sort((a, b) => Date.parse(b.created_at) - Date.parse(a.created_at));
            const versionsToDelete = rollingVersions.slice(5);
            core.info(`Keeping ${Math.min(rollingVersions.length, 5)} rolling image versions.`);
            for (const version of versionsToDelete) {
              core.info(`Deleting container version ${version.id}: ${version.metadata.container.tags.join(', ')}`);
              await github.request(deleteRoute, {
                ...scope,
                package_type: 'container',
                package_name: packageName,
                package_version_id: version.id,
              });
            }
